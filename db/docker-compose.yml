version: '3.9'

services:

  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_USER=odoo_user"
      - "POSTGRES_PASSWORD=odoo_pass"
      - "POSTGRES_HOST_AUTH_METHOD=md5"
    ports:
      - "5432:5432"

volumes:
  postgres_data:
